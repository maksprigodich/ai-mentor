<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Mentor — кабинет</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="bg"></div><div class="mobile-overlay" id="mobile-overlay"></div><aside class="sidebar glass" id="sidebar"><div class="brand side-brand">AI-<span>Mentor</span></div><button id="new-chat" class="primary full">+ Новый чат</button><div class="side-title">Твои диалоги</div><div id="history" class="history"></div><div class="side-bottom"><button id="profile-btn" class="ghost full">Профиль</button><button id="settings-btn" class="ghost full">Настройки</button><button id="logout" class="ghost danger full">Выйти</button></div></aside><main class="workspace"><header class="topbar glass"><button id="burger" class="icon-btn">☰</button><div><div class="top-title" id="top-title">AI-Mentor</div><div class="top-sub" id="top-sub">Твой следующий шаг начинается здесь</div></div><div class="top-actions"><button id="dashboard-btn" class="ghost">Обзор</button></div></header><section class="content"><div id="dashboard" class="dashboard"></div><div id="profile-panel" class="panel glass hidden"></div><div id="settings-panel" class="panel glass hidden"></div><section id="chat-panel" class="chat-panel glass hidden"><div class="chat-head"><div><div class="chat-title" id="chat-title">Новый диалог</div><div class="chat-meta">AI-Mentor учитывает твой профиль и историю этого чата</div></div><span class="status-dot">ONLINE</span></div><div id="messages" class="messages"></div><div class="suggestions" id="suggestions"><button>Помоги выбрать направление</button><button>Составь мне план на месяц</button><button>Что мне подтянуть?</button></div><form id="message-form" class="composer"><input id="message-input" placeholder="Напиши, что тебя волнует..." autocomplete="off"><button class="primary send" type="submit">→</button></form></section></div></main><script src="app.js"></script></body></html>
