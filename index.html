<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Mentor — путь к профессии</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="bg"></div><main class="auth-page"><section class="auth-card glass"><div class="brand">AI-<span>Mentor</span></div><p class="eyebrow">PERSONAL EDUCATION OS</p><h1>Построй свой путь<br>от учёбы до карьеры.</h1><p class="sub">AI-Mentor собирает твой профиль, помогает выбрать направление и превращает цель в понятный план действий.</p><div class="auth-tabs"><button class="tab active" data-mode="login">Войти</button><button class="tab" data-mode="register">Создать аккаунт</button></div><form id="auth-form"><label>Email<input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></label><label>Пароль<input id="password" type="password" placeholder="Минимум 6 символов" autocomplete="current-password" required></label><div id="auth-error" class="error"></div><button class="primary" type="submit" id="auth-submit">Войти в AI-Mentor</button></form><p class="auth-note">Твои чаты и профиль сохраняются на сервере.</p></section></main><script src="auth.js"></script></body></html>
